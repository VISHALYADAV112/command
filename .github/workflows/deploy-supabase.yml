name: Deploy Supabase

run-name: Deploy Supabase ${{ inputs.stage }} at ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Production stage to run (backfill verification is deliberately separate)
        required: true
        type: choice
        options:
          - migrations
          - functions
      release_sha:
        description: Exact 40-character commit SHA approved for the cutover
        required: true
        type: string
      backup_verified:
        description: Confirm the private encrypted production export passed verification
        required: true
        default: false
        type: boolean
      backfill_verified:
        description: Confirm the transactional production backfill report passed
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved release commit
        env:
          BACKFILL_VERIFIED: ${{ inputs.backfill_verified }}
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
        run: |
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_RELEASE_SHA"
          if [[ "$RELEASE_STAGE" == "migrations" ]]; then
            test "$BACKUP_VERIFIED" = "true"
          else
            test "$BACKFILL_VERIFIED" = "true"
          fi

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0
          github-token: ${{ github.token }}

      - name: Link project
        if: inputs.stage == 'migrations'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview migrations
        if: inputs.stage == 'migrations'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        if: inputs.stage == 'migrations'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Enable MCP OAuth server
        if: inputs.stage == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"oauth_server_enabled":true,"oauth_server_allow_dynamic_registration":true,"oauth_server_authorization_path":"/oauth/consent"}'

      - name: Deploy Calendar function
        if: inputs.stage == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy google-calendar --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy Command MCP function
        if: inputs.stage == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy command-mcp --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
